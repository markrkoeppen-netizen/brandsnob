<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deal Guides & Trend Roundups | BrandSnobs</title>
    <meta name="description" content="Seasonal deal guides and trend roundups from BrandSnobs — real picks, real commentary, tied to what's actually on sale right now." />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #171717; }
      header { background: white; border-bottom: 1px solid #e5e5e5; padding: 1.25rem 1rem; }
      .header-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: center; gap: 0.5rem; }
      header a { text-decoration: none; color: #171717; font-weight: 700; font-size: 1.25rem; font-family: Georgia, serif; }
      main { max-width: 800px; margin: 0 auto; padding: 2rem 1rem 4rem; }
      h1 { font-family: Georgia, serif; font-size: 2rem; margin-bottom: 0.5rem; }
      .subtitle { color: #737373; margin-bottom: 2.5rem; }
      .post-card { display: block; text-decoration: none; color: inherit; background: white; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; transition: border-color 0.15s; }
      .post-card:hover { border-color: #a3a3a3; }
      .post-season { display: inline-block; background: #f5f5f5; color: #525252; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.25rem 0.6rem; border-radius: 999px; margin-bottom: 0.75rem; }
      .post-title { font-family: Georgia, serif; font-size: 1.35rem; margin-bottom: 0.5rem; }
      .post-excerpt { color: #525252; line-height: 1.5; }
      .post-date { color: #a3a3a3; font-size: 0.8rem; margin-top: 0.75rem; }
      .empty-state { text-align: center; color: #a3a3a3; padding: 3rem 1rem; }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a href="/">← BrandSnobs</a>
      </div>
    </header>
    <main>
      <h1>Deal Guides & Trend Roundups</h1>
      <p class="subtitle">Real picks, real commentary — tied to what's actually on sale right now.</p>
      <div id="posts-container">
        <div class="empty-state">Loading...</div>
      </div>
    </main>

    <script>
      const API_BASE = 'https://brandsnobs-backend-production.up.railway.app';

      function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      }

      async function loadPosts() {
        const container = document.getElementById('posts-container');
        try {
          const response = await fetch(`${API_BASE}/api/editorial-posts`);
          const result = await response.json();

          if (!result.success || !result.posts || result.posts.length === 0) {
            container.innerHTML = '<div class="empty-state">No guides published yet — check back soon.</div>';
            return;
          }

          container.innerHTML = result.posts.map(post => `
            <a class="post-card" href="/deals/${encodeURIComponent(post.slug)}">
              ${post.season ? `<span class="post-season">${post.season}</span>` : ''}
              <div class="post-title">${post.title}</div>
              <div class="post-excerpt">${post.excerpt || ''}</div>
              <div class="post-date">${formatDate(post.publishedAt)}</div>
            </a>
          `).join('');
        } catch (error) {
          container.innerHTML = '<div class="empty-state">Could not load guides right now — please try again shortly.</div>';
        }
      }

      loadPosts();
    </script>
  </body>
</html>
